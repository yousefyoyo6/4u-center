<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4U | إدارة الطلاب والمدرسين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{box-sizing:border-box}body{font-family:Cairo,sans-serif;background:#f5f7fb;color:#0f172a}
.sidebar{background:linear-gradient(180deg,#07101f,#111c32)}.nav.active{background:#2563eb;color:white;box-shadow:0 10px 30px #2563eb55}
.card{background:white;border:1px solid #e7edf6;border-radius:22px;box-shadow:0 8px 30px #0f172a0a}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
@media(max-width:900px){.sidebar{position:fixed;right:-280px;top:0;height:100vh;width:270px;z-index:50;transition:.25s}.sidebar.open{right:0}}
</style>
</head>
<body>
<div class="min-h-screen flex">
<aside id="side" class="sidebar w-72 p-5 text-slate-300 shrink-0">
<div class="mb-10"><div class="text-white text-3xl font-black italic">4U</div><div class="text-blue-400 text-[10px] tracking-[.3em] font-bold">CENTER MANAGEMENT</div></div>
<nav class="space-y-2">
<button class="nav active w-full text-right p-3 rounded-xl font-bold" data-v="students" onclick="setView('students')"><i class="fa-solid fa-user-graduate ml-3"></i>الطلاب</button>
<button class="nav w-full text-right p-3 rounded-xl font-bold" data-v="teachers" onclick="setView('teachers')"><i class="fa-solid fa-chalkboard-user ml-3"></i>المدرسون</button>
<button class="nav w-full text-right p-3 rounded-xl font-bold" data-v="attendance" onclick="setView('attendance')"><i class="fa-solid fa-calendar-check ml-3"></i>الغياب والحضور</button>
</nav>
</aside>
<main class="flex-1 min-w-0">
<header class="bg-white border-b px-5 md:px-8 py-4 flex items-center gap-4 sticky top-0 z-20">
<button class="md:hidden text-xl" onclick="document.getElementById('side').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
<div class="flex-1"><h1 id="title" class="font-black text-xl">إدارة الطلاب</h1><p class="text-xs text-slate-400">نظام مبسط لإدارة السنتر</p></div>
<button id="mainAdd" onclick="addStudent()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold"><i class="fa-solid fa-plus ml-2"></i>إضافة طالب</button>
</header>
<section id="content" class="p-5 md:p-8"></section>
</main></div>
<script>
const KEY='4U_CENTER_DATABASE_V6';
const GRADES=['الأول الإعدادي','الثاني الإعدادي','الثالث الإعدادي','الأول الثانوي','الثاني الثانوي','الثالث الثانوي','الأول باكالوريا','الثاني باكالوريا'];
let old={};try{old=JSON.parse(localStorage.getItem('4U_CENTER_DATABASE_V5')||'{}')}catch(e){}
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{teachers:old.teachers||[],students:old.students||[],attendance:old.attendance||{}};
let view='students'; const save=()=>localStorage.setItem(KEY,JSON.stringify(db)); const uid=()=>Date.now()+Math.floor(Math.random()*9999);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const teacher=id=>db.teachers.find(t=>+t.id===+id);
function setView(v){view=v;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.v===v));document.getElementById('side').classList.remove('open');render()}
function render(){let titles={students:'إدارة الطلاب',teachers:'إدارة المدرسين',attendance:'الحضور والغياب'};title.textContent=titles[view];mainAdd.style.display=view==='attendance'?'none':'';mainAdd.textContent=view==='teachers'?'إضافة مدرس':'إضافة طالب';mainAdd.onclick=view==='teachers'?addTeacher:addStudent;content.innerHTML=view==='students'?studentsHTML():view==='teachers'?teachersHTML():attendanceHTML()}
function studentsHTML(){return `<div class="space-y-5"><div class="card p-4 flex flex-col md:flex-row gap-3"><input id="q" oninput="filterStudents()" class="p-3 bg-slate-100 rounded-xl flex-1" placeholder="ابحث باسم الطالب أو رقم ولي الأمر"><select id="gf" onchange="filterStudents()" class="p-3 bg-slate-100 rounded-xl"><option value="">كل السنوات الدراسية</option>${GRADES.map(g=>`<option>${g}</option>`).join('')}</select><select id="tf" onchange="filterStudents()" class="p-3 bg-slate-100 rounded-xl"><option value="">كل المدرسين</option>${db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="card overflow-auto"><table class="w-full min-w-[750px]"><thead class="bg-slate-50 text-sm"><tr><th class="p-4 text-right">الطالب</th><th>السنة الدراسية</th><th>المدرس</th><th>ولي الأمر</th><th>إجراءات</th></tr></thead><tbody id="rows">${db.students.map(studentRow).join('')||`<tr><td colspan="5" class="p-10 text-center text-slate-400">لا يوجد طلاب حتى الآن</td></tr>`}</tbody></table></div></div>`}
function studentRow(s){let t=teacher(s.teacherId);return `<tr class="border-t"><td class="p-4 font-bold">${esc(s.name)}<div class="text-xs text-slate-400">${esc(s.phone||'')}</div></td><td><span class="badge bg-purple-100 text-purple-700">${esc(s.grade)}</span></td><td>${esc(t?.name||'غير محدد')}</td><td>${esc(s.parentName||'غير مسجل')}</td><td><button onclick="editStudent(${s.id})" class="text-amber-500 ml-3"><i class="fa-solid fa-pen"></i></button><button onclick="deleteStudent(${s.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>`}
function filterStudents(){let q=(document.getElementById('q').value||'').toLowerCase(),g=gf.value,t=tf.value;rows.innerHTML=db.students.filter(s=>`${s.name} ${s.phone||''}`.toLowerCase().includes(q)&&(!g||s.grade===g)&&(!t||+s.teacherId===+t)).map(studentRow).join('')||`<tr><td colspan="5" class="p-8 text-center">لا توجد نتائج</td></tr>`}
function teachersHTML(){return `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${db.teachers.map(t=>teacherCard(t)).join('')||'<div class="card p-10 text-center text-slate-400">لم تتم إضافة مدرسين بعد</div>'}</div>`}
function teacherCard(t){let ts=db.students.filter(s=>+s.teacherId===+t.id);let groups=[...new Set(ts.map(s=>s.grade))];return `<div class="card p-5"><div class="flex justify-between"><div><div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 grid place-items-center"><i class="fa-solid fa-chalkboard-user"></i></div><h2 class="font-black text-lg mt-3">${esc(t.name)}</h2><p class="text-blue-600 text-sm font-bold">${esc(t.subject||'')}</p></div><div><button onclick="editTeacher(${t.id})" class="text-amber-500 ml-2"><i class="fa-solid fa-pen"></i></button><button onclick="deleteTeacher(${t.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div></div><div class="mt-5 border-t pt-4"><div class="font-black mb-3">طلاب المدرس حسب السنة الدراسية</div>${groups.length?groups.map(g=>`<button onclick="showTeacherGrade(${t.id},'${g}')" class="w-full flex justify-between items-center bg-slate-50 hover:bg-blue-50 p-3 rounded-xl mb-2"><span>${esc(g)}</span><span class="badge bg-blue-100 text-blue-700">${ts.filter(s=>s.grade===g).length} طالب</span></button>`).join(''):'<p class="text-sm text-slate-400">لا يوجد طلاب مسجلون لهذا المدرس.</p>'}</div></div>`}
function showTeacherGrade(id,g){let t=teacher(id),list=db.students.filter(s=>+s.teacherId===+id&&s.grade===g);Swal.fire({title:`${t.name} - ${g}`,html:`<div style="text-align:right">${list.map((s,i)=>`<div style="padding:10px;border-bottom:1px solid #eee">${i+1}. ${esc(s.name)}</div>`).join('')||'لا يوجد طلاب'}</div>`,confirmButtonText:'إغلاق'})}
function attendanceHTML(){let today=new Date().toISOString().slice(0,10);return `<div class="space-y-5"><div class="card p-5"><div class="flex flex-col md:flex-row gap-3"><input id="date" type="date" value="${today}" onchange="renderAttendance()" class="p-3 bg-slate-100 rounded-xl"><select id="atTeacher" onchange="renderAttendance()" class="p-3 bg-slate-100 rounded-xl"><option value="">كل المدرسين</option>${db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><select id="atGrade" onchange="renderAttendance()" class="p-3 bg-slate-100 rounded-xl"><option value="">كل السنوات</option>${GRADES.map(g=>`<option>${g}</option>`).join('')}</select></div></div><div id="attList" class="space-y-3"></div></div>`}
function renderAttendance(){let d=date.value,tid=atTeacher.value,g=atGrade.value;let list=db.students.filter(s=>(!tid||+s.teacherId===+tid)&&(!g||s.grade===g));attList.innerHTML=list.map(s=>{let st=db.attendance[d]?.[s.id];return `<div class="card p-4 flex flex-wrap gap-3 items-center"><div class="flex-1"><b>${esc(s.name)}</b><div class="text-xs text-slate-400">${esc(s.grade)} • ${esc(teacher(s.teacherId)?.name||'')}</div></div><button onclick="mark(${s.id},true)" class="px-4 py-2 rounded-xl ${st===true?'bg-green-600 text-white':'bg-green-50 text-green-700'}">حاضر</button><button onclick="mark(${s.id},false)" class="px-4 py-2 rounded-xl ${st===false?'bg-red-600 text-white':'bg-red-50 text-red-700'}">غائب</button>${st===false?`<button onclick="absenceMessage(${s.id})" class="px-4 py-2 rounded-xl bg-emerald-600 text-white"><i class="fa-brands fa-whatsapp ml-1"></i>إرسال رسالة الغياب</button>`:''}</div>`}).join('')||'<div class="card p-10 text-center">لا يوجد طلاب مطابقون للفلاتر</div>'}
function mark(id,status){let d=date.value;db.attendance[d]??={};db.attendance[d][id]=status;save();renderAttendance()}
function absenceMessage(id){let s=db.students.find(x=>+x.id===+id),d=date.value;let msg=`السيد/ة ولي أمر الطالب ${s.name}،\n\nنحيط سيادتكم علمًا بأن الطالب لم يحضر إلى الحصة اليوم ${new Date(d).toLocaleDateString('ar-EG')}.\n\nنرجو التواصل معنا في حال وجود أي عذر أو استفسار.\n\nمع خالص التحية،\nإدارة السنتر 4U`;if(!s.phone)return Swal.fire('تنبيه','رقم ولي الأمر غير مسجل','warning');let phone=s.phone.replace(/\D/g,'');if(phone.startsWith('01'))phone='2'+phone;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank')}
async function addTeacher(){let r=await Swal.fire({title:'إضافة مدرس',html:'<input id="n" class="swal2-input" placeholder="اسم المدرس"><input id="sub" class="swal2-input" placeholder="المادة">',showCancelButton:true,confirmButtonText:'إضافة',preConfirm:()=>{let name=n.value.trim();if(!name){Swal.showValidationMessage('اكتب اسم المدرس');return false}return{name,subject:sub.value.trim()}}});if(r.isConfirmed){db.teachers.push({id:uid(),...r.value});save();render()}}
async function editTeacher(id){let t=teacher(id);let r=await Swal.fire({title:'تعديل المدرس',html:`<input id="n" class="swal2-input" value="${esc(t.name)}"><input id="sub" class="swal2-input" value="${esc(t.subject||'')}">`,showCancelButton:true,preConfirm:()=>({name:n.value.trim(),subject:sub.value.trim()})});if(r.isConfirmed){Object.assign(t,r.value);save();render()}}
async function deleteTeacher(id){if((await Swal.fire({title:'حذف المدرس؟',showCancelButton:true,confirmButtonText:'حذف'})).isConfirmed){db.teachers=db.teachers.filter(t=>+t.id!==+id);db.students.forEach(s=>{if(+s.teacherId===+id)s.teacherId=''});save();render()}}
function teacherOptions(selected=''){return db.teachers.map(t=>`<option value="${t.id}" ${+t.id===+selected?'selected':''}>${esc(t.name)} — ${esc(t.subject||'')}</option>`).join('')}
async function addStudent(){if(!db.teachers.length)return Swal.fire('تنبيه','أضف مدرسًا أولًا','warning');let r=await Swal.fire({title:'إضافة طالب',html:`<input id="sn" class="swal2-input" placeholder="اسم الطالب"><input id="pn" class="swal2-input" placeholder="اسم ولي الأمر"><input id="ph" class="swal2-input" placeholder="رقم ولي الأمر"><select id="sg" class="swal2-input"><option value="">اختر السنة الدراسية</option>${GRADES.map(g=>`<option>${g}</option>`).join('')}</select><select id="st" class="swal2-input"><option value="">اختر المدرس</option>${teacherOptions()}</select>`,showCancelButton:true,preConfirm:()=>{if(!sn.value.trim()||!sg.value||!st.value){Swal.showValidationMessage('أكمل البيانات الأساسية');return false}return{name:sn.value.trim(),parentName:pn.value.trim(),phone:ph.value.trim(),grade:sg.value,teacherId:st.value}}});if(r.isConfirmed){db.students.push({id:uid(),...r.value});save();render()}}
async function editStudent(id){let s=db.students.find(x=>+x.id===+id);let r=await Swal.fire({title:'تعديل الطالب',html:`<input id="sn" class="swal2-input" value="${esc(s.name)}"><input id="pn" class="swal2-input" value="${esc(s.parentName||'')}"><input id="ph" class="swal2-input" value="${esc(s.phone||'')}"><select id="sg" class="swal2-input">${GRADES.map(g=>`<option ${s.grade===g?'selected':''}>${g}</option>`).join('')}</select><select id="st" class="swal2-input">${teacherOptions(s.teacherId)}</select>`,showCancelButton:true,preConfirm:()=>({name:sn.value.trim(),parentName:pn.value.trim(),phone:ph.value.trim(),grade:sg.value,teacherId:st.value})});if(r.isConfirmed){Object.assign(s,r.value);save();render()}}
async function deleteStudent(id){if((await Swal.fire({title:'حذف الطالب؟',text:'سيتم حذف بيانات الطالب وسجل غيابه.',showCancelButton:true,confirmButtonText:'حذف'})).isConfirmed){db.students=db.students.filter(s=>+s.id!==+id);Object.values(db.attendance).forEach(x=>delete x[id]);save();render()}}
render();setTimeout(()=>view==='attendance'&&renderAttendance(),0);
</script></body></html>
