<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyCyhPyQKnDYsjOonkInpOT1pw-0U-RCeaQ",
    authDomain: "center-data-7638a.firebaseapp.com",
    projectId: "center-data-7638a",
    storageBucket: "center-data-7638a.firebasestorage.app",
    messagingSenderId: "698056810488",
    appId: "1:698056810488:web:5e64995fd6eb16c5ae000d",
    measurementId: "G-74KLFXWWC1",
    databaseURL: "https://center-data-7638a-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const databaseRef = ref(database, "4U_CENTER");


/* =========================
   Database
========================= */

const KEY = "4U_CENTER_DATABASE_V6";

const GRADES = [
    "الأول الإعدادي",
    "الثاني الإعدادي",
    "الثالث الإعدادي",
    "الأول الثانوي",
    "الثاني الثانوي",
    "الثالث الثانوي",
    "الأول باكالوريا",
    "الثاني باكالوريا"
];

const SCHEDULES = {
    "sat-tue": {
        label: "السبت + الثلاثاء",
        days: [6, 2]
    },
    "sun-wed": {
        label: "الأحد + الأربعاء",
        days: [0, 3]
    },
    "mon-thu": {
        label: "الاثنين + الخميس",
        days: [1, 4]
    }
};

const ARABIC_DAYS = [
    "الأحد",
    "الاثنين",
    "الثلاثاء",
    "الأربعاء",
    "الخميس",
    "الجمعة",
    "السبت"
];


let oldData = {};

try {

    oldData = JSON.parse(
        localStorage.getItem("4U_CENTER_DATABASE_V5") || "{}"
    );

} catch {

    oldData = {};

}


let localData = null;

try {

    localData = JSON.parse(
        localStorage.getItem(KEY) || "null"
    );

} catch {

    localData = null;

}


let db = localData || {
    teachers: oldData.teachers || [],
    students: oldData.students || [],
    attendance: oldData.attendance || {},
    payments: oldData.payments || {}
};


db.teachers ||= [];
db.students ||= [];
db.attendance ||= {};
db.payments ||= {};

/* =========================
   Groups
========================= */

function ensureGroupStructure(database) {

    database.teachers ||= [];
    database.students ||= [];

    database.teachers.forEach(t => {

        t.groups = Array.isArray(t.groups) ? t.groups : [];

        // Migrate the old model: one schedule per grade -> one default group per grade.
        if (!t.groups.length && t.schedules && typeof t.schedules === "object") {
            Object.entries(t.schedules).forEach(([grade, schedule]) => {
                if (!schedule) return;
                t.groups.push({
                    id: uid(),
                    name: "مجموعة 1",
                    grade,
                    schedule,
                    time: ""
                });
            });
        }

        t.groups.forEach((g, index) => {
            g.id ||= uid();
            g.name ||= `مجموعة ${index + 1}`;
            g.grade ||= "";
            g.schedule ||= "";
            g.time ||= "";
        });

        // Keep old schedules only for backward compatibility; groups are now the source of truth.
        t.schedules = {};
    });

    // Attach old students to the first matching group of the same teacher/year.
    database.students.forEach(student => {
        if (student.groupId) return;

        const t = database.teachers.find(x => +x.id === +student.teacherId);
        const g = t?.groups?.find(x => x.grade === student.grade);
        if (g) student.groupId = g.id;
    });

    return database;
}

ensureGroupStructure(db);


let view = "students";
let firebaseReady = false;


/* =========================
   UI State
========================= */

const uiState = {

    students: {
        search: "",
        grade: "",
        teacher: ""
    },

    teachers: {
        search: ""
    },

    attendance: {
        date: getToday(),
        teacher: "",
        grade: "",
        group: "",
        search: ""
    },

    payments: {
        month: getCurrentMonth(),
        teacher: "",
        grade: "",
        search: ""
    }

};


/* =========================
   Helpers
========================= */

function getToday() {

    const now = new Date();

    return new Date(
        now.getTime() -
        now.getTimezoneOffset() * 60000
    )
    .toISOString()
    .slice(0, 10);

}


function getCurrentMonth() {

    const now = new Date();

    return `${now.getFullYear()}-${String(
        now.getMonth() + 1
    ).padStart(2, "0")}`;

}


function saveLocal() {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify(db)
        );

    } catch(error) {

        console.error(
            "LocalStorage error:",
            error
        );

    }

}


function uid() {

    return Date.now() +
        Math.floor(Math.random() * 9999);

}


function esc(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[char])
        );

}


function teacher(id) {

    return db.teachers.find(
        t => +t.id === +id
    );

}


/* =========================
   Firebase Status
========================= */

function setFirebaseStatus(ok, text) {

    const status =
        document.getElementById(
            "firebaseStatus"
        );

    const statusText =
        document.getElementById(
            "firebaseStatusText"
        );

    if (!status || !statusText) {
        return;
    }

    status.classList.toggle(
        "error",
        !ok
    );

    statusText.textContent = text;

}


/* =========================
   Firebase Save
========================= */

async function saveDatabase(showError = true) {

    saveLocal();

    if (!firebaseReady) {
        return false;
    }

    try {

        await set(
            databaseRef,
            db
        );

        setFirebaseStatus(
            true,
            "متصل بـ Firebase"
        );

        return true;

    } catch(error) {

        console.error(
            "Firebase save error:",
            error
        );

        setFirebaseStatus(
            false,
            "خطأ في الحفظ"
        );

        if (showError) {

            Swal.fire({
                icon: "error",
                title: "تعذر الحفظ",
                text:
                    "حدث خطأ أثناء حفظ البيانات على Firebase."
            });

        }

        return false;

    }

}


/* =========================
   Normalize Remote Data
========================= */

function normalizeDatabase(data) {

    const teachers =
        Array.isArray(data?.teachers)
            ? data.teachers.map(item => ({
                ...item,
                groups: Array.isArray(item?.groups) ? item.groups : [],
                schedules:
                    item?.schedules &&
                    typeof item.schedules === "object"
                        ? item.schedules
                        : {}
            }))
            : [];

    const normalized = {

        teachers,

        students:
            Array.isArray(data?.students)
                ? data.students
                : [],

        attendance:
            data?.attendance || {},

        payments:
            data?.payments || {}

    };

    return ensureGroupStructure(normalized);

}


/* =========================
   Firebase Initialize
========================= */

async function initializeFirebase() {

    try {

        setFirebaseStatus(
            true,
            "جاري الاتصال..."
        );

        const snapshot =
            await get(databaseRef);


        if (snapshot.exists()) {

            db = normalizeDatabase(
                snapshot.val()
            );

            saveLocal();

        } else {

            await set(
                databaseRef,
                db
            );

            saveLocal();

        }


        firebaseReady = true;

        setFirebaseStatus(
            true,
            "متصل بـ Firebase"
        );


        onValue(
            databaseRef,
            snapshot => {

                if (!snapshot.exists()) {
                    return;
                }

                db =
                    normalizeDatabase(
                        snapshot.val()
                    );

                saveLocal();

                render();

            }
        );


        render();

    } catch(error) {

        console.error(
            "Firebase connection error:",
            error
        );

        firebaseReady = false;

        setFirebaseStatus(
            false,
            "غير متصل"
        );

        render();

    }

}



/* =========================
   Site Password
========================= */

const SITE_PASSWORD = "4U2026";
const LOGIN_SESSION_KEY = "4U_AUTHENTICATED";

function isLoggedIn() {
    return sessionStorage.getItem(
        LOGIN_SESSION_KEY
    ) === "true";
}

function showApp() {

    const screen =
        document.getElementById("loginScreen");

    if (screen) {
        screen.classList.add("hidden");
    }

}

function checkPassword() {

    const input =
        document.getElementById("loginPassword");

    const error =
        document.getElementById("loginError");

    if (!input || !error) {
        return;
    }

    if (input.value === SITE_PASSWORD) {

        sessionStorage.setItem(
            LOGIN_SESSION_KEY,
            "true"
        );

        error.textContent = "";

        showApp();

        input.value = "";

        return;
    }

    error.textContent =
        "كلمة المرور غير صحيحة";

    input.value = "";

    input.focus();

}

function initializeLogin() {

    if (isLoggedIn()) {
        showApp();
        return;
    }

    setTimeout(() => {

        const input =
            document.getElementById(
                "loginPassword"
            );

        input?.focus();

    }, 100);

}


/* =========================
   Views
========================= */

function setView(newView) {

    view = newView;

    document
        .querySelectorAll(".nav")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.v === newView
            );

        });


    document
        .getElementById("side")
        .classList.remove("open");


    render();

}


function render() {

    const titles = {

        students: "إدارة الطلاب",
        teachers: "إدارة المدرسين",
        attendance: "الحضور والغياب",
        payments: "فلوس الشهر"

    };


    document.getElementById(
        "title"
    ).textContent = titles[view];


    const mainAdd =
        document.getElementById(
            "mainAdd"
        );


    const noAdd =
        view === "attendance" ||
        view === "payments";


    mainAdd.style.display =
        noAdd
            ? "none"
            : "";


    mainAdd.innerHTML =
        view === "teachers"

            ? '<i class="fa-solid fa-plus ml-2"></i>إضافة مدرس'

            : '<i class="fa-solid fa-plus ml-2"></i>إضافة طالب';


    mainAdd.onclick =
        view === "teachers"
            ? addTeacher
            : addStudent;


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML =
        view === "students"
            ? studentsHTML()
            : view === "teachers"
                ? teachersHTML()
                : view === "attendance"
                    ? attendanceHTML()
                    : paymentsHTML();


    if (view === "students") {

        renderStudentRows();

    }

    if (view === "teachers") {

        renderTeacherCards();

    }

    if (view === "attendance") {

        renderAttendance();

    }

    if (view === "payments") {

        renderPayments();

    }

}


/* =========================
   Students
========================= */

function studentsHTML() {

    return `

        <div class="space-y-5">

            <div class="card p-4 flex flex-col md:flex-row gap-3">

                <input
                    id="q"
                    class="p-3 bg-slate-100 rounded-xl flex-1 outline-none"
                    placeholder="ابحث بالاسم أو ولي الأمر أو الهاتف أو المجموعة أو كود الطالب"

function getTeacherScheduleCode(student) {

    const t = teacher(student.teacherId);
    const group = t?.groups?.find(g => String(g.id) === String(student.groupId));
    return group?.schedule || "";

}

function getStudentGroup(student) {
    const t = teacher(student.teacherId);
    return t?.groups?.find(g => String(g.id) === String(student.groupId)) || null;
}

function getStudentGroupLabel(student) {
    return getStudentGroup(student)?.name || "غير محددة";
}

function isScheduledDate(student, date) {

    const code = getTeacherScheduleCode(student);
    const schedule = SCHEDULES[code];

    if (!schedule) {
        return false;
    }

    const day = new Date(`${date}T12:00:00`).getDay();
    return schedule.days.includes(day);

}

function getAttendanceDates(students, anchorDate, limit = 10) {

    const dates = [];
    const seen = new Set();

    const addDate = date => {
        if (!seen.has(date)) {
            seen.add(date);
            dates.push(date);
        }
    };

    addDate(anchorDate);

    const cursor = new Date(`${anchorDate}T12:00:00`);

    for (let i = 0; i < 90 && dates.length < limit; i++) {

        cursor.setDate(cursor.getDate() - 1);

        const date = cursor.toISOString().slice(0, 10);

        if (students.some(student => isScheduledDate(student, date))) {
            addDate(date);
        }

    }

    return dates;

}

function formatAttendanceDate(date) {

    const parts = date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return `${parts[2]}/${parts[1]}`;

}

function getArabicWeekDay(date) {
    const d = new Date(`${date}T12:00:00`);
    return ARABIC_DAYS[d.getDay()];
}

function getAbsenceStreak(studentId, anchorDate) {

    const student = db.students.find(item => +item.id === +studentId);

    if (!student) return 0;

    const cursor = new Date(`${anchorDate}T12:00:00`);
    let streak = 0;
    let started = false;

    for (let i = 0; i < 90; i++) {

        const date = cursor.toISOString().slice(0, 10);

        if (isScheduledDate(student, date)) {

            const status = db.attendance?.[date]?.[student.id];

            if (status === false) {
                streak++;
                started = true;
            } else if (status === true) {
                break;
            } else if (started) {
                break;
            }

        }

        cursor.setDate(cursor.getDate() - 1);

    }

    return streak;

}

function filterByAttendanceSearch(list) {

    const q = uiState.attendance.search.trim().toLowerCase();

    if (!q) return list;

    return list.filter(student => {

        const teacherName = teacher(student.teacherId)?.name || "";

        const text =
            `${student.name || ""} ${student.parentName || ""} ${student.phone || ""} ${student.grade || ""} ${teacherName} ${getStudentGroupLabel(student)} ${student.id || ""}`
                .toLowerCase();

        return text.includes(q);

    });

}

function renderAttendance() {

    const rows = document.getElementById("attRows");
    if (!rows) return;

    const baseList =
        db.students.filter(student =>
            (!uiState.attendance.teacher ||
                +student.teacherId === +uiState.attendance.teacher) &&
            (!uiState.attendance.grade ||
                student.grade === uiState.attendance.grade) &&
            (!uiState.attendance.group ||
                String(student.groupId) === String(uiState.attendance.group))
        );

    const list = filterByAttendanceSearch(baseList);

    const dates = getAttendanceDates(
        baseList,
        uiState.attendance.date,
        10
    );

    rows.innerHTML =
        list.map(student => {

            const streak =
                getAbsenceStreak(
                    student.id,
                    uiState.attendance.date
                );

            return `
                <tr>
                    <td class="attendance-student p-3">
                        <div class="font-black">
                            ${esc(student.name)}
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1">
                            ${esc(student.grade)} • ${esc(getStudentGroupLabel(student))} • ${esc(teacher(student.teacherId)?.name || "غير محدد")}
                        </div>
                        ${streak > 0 ? `
                            <span class="streak-badge">
                                غائب ${streak} حصة متتالية
                            </span>
                        ` : ""}
                    </td>

                    ${dates.map(date => {

                        const scheduled =
                            isScheduledDate(student, date);

                        const status =
                            db.attendance?.[date]?.[student.id];

                        const isCurrent =
                            date === uiState.attendance.date;

                        return `
                            <td class="lesson-cell ${scheduled ? "" : "unscheduled"}">
                                ${!scheduled ? `
                                    <span class="att-state empty">—</span>
                                    <span class="lesson-note">لا توجد حصة</span>
                                ` : `
                                    <span class="att-state ${
                                        status === true
                                            ? "present"
                                            : status === false
                                                ? "absent"
                                                : "empty"
                                    }">
                                        ${
                                            status === true
                                                ? "✓"
                                                : status === false
                                                    ? "✕"
                                                    : "—"
                                        }
                                    </span>

                                    ${isCurrent ? `
                                        <div class="att-edit">
                                            <button
                                                onclick="markAttendance(${student.id},true)"
                                                class="att-mini present ${status === true ? "active" : ""}"
                                                title="حاضر">✓</button>
                                            <button
                                                onclick="markAttendance(${student.id},false)"
                                                class="att-mini absent ${status === false ? "active" : ""}"

                                        </div>
                                    ` : ""}
                                `}
                            </td>
                        `;

                    }).join("")}
                </tr>
            `;

        }).join("")
        ||
        `

                <td colspan="${dates.length + 1}" class="p-10 text-center text-slate-400">

                        baseList.length
                            ? "لا توجد نتائج مطابقة للبحث"
                            : "لا يوجد طلاب مطابقون للفلاتر"
                    }
                </td>
            </tr>
        `;

}

async function markAttendance(
    id,
    status
) {

    const date =
        uiState.attendance.date ||
        getToday();

    db.attendance ||= {};
    db.attendance[date] ||= {};

    db.attendance[date][id] =
        status;

    saveLocal();

    if (firebaseReady) {

        try {

            await set(
                databaseRef,
                db
            );

            setFirebaseStatus(
                true,
                "متصل بـ Firebase"
            );

        } catch(error) {

            console.error(
                "Attendance save error:",
                error
            );

            setFirebaseStatus(
                false,
                "خطأ في الحفظ"
            );

            Swal.fire({
                icon: "error",
                title: "تعذر الحفظ",
                text:
                    "لم يتم حفظ الحضور على Firebase."
            });

            return;

        }

    }

    renderAttendance();

    // بعد تسجيل الغياب، اسأل المستخدم أولًا هل يريد التواصل مع ولي الأمر
    if (status === false) {
        const student = db.students.find(
            item => +item.id === +id
        );

        const result = await Swal.fire({
            icon: "warning",
            title: "تم تسجيل الغياب",
            text: `هل تريد التواصل مع ولي أمر ${student?.name || "الطالب"}؟`,
            showCancelButton: true,
            confirmButtonText: "تواصل مع ولي الأمر",
            cancelButtonText: "لاحقًا",
            confirmButtonColor: "#16a34a"
        });

        if (result.isConfirmed) {
            absenceMessage(id, date);
        }
    }

}

   WhatsApp
========================= */


function normalizeEgyptPhone(phone) {

    let value = String(phone || "").replace(/\D/g, "");

    if (value.startsWith("0020")) {
        value = value.slice(2);
    }

    if (value.startsWith("20")) {
        return value;
    }

    if (value.startsWith("0")) {
        return "20" + value.slice(1);
    }

    return value;

}


function parentWhatsApp(id) {

    const student =
        db.students.find(
            item => +item.id === +id
        );

    if (!student) return;

    if (!student.phone) {
        Swal.fire(
            "تنبيه",
            "رقم ولي الأمر غير مسجل",
            "warning"
        );
        return;
    }

    const phone = normalizeEgyptPhone(student.phone);

    if (!phone) {
        Swal.fire(
            "تنبيه",
            "رقم ولي الأمر غير صالح",
            "warning"
        );
        return;
    }

    const message =
`السيد/ة ${student.parentName || "ولي أمر"}،

مرحبًا، نود التواصل معكم بخصوص الطالب ${student.name}.

مع خالص التحية،
إدارة السنتر 4U`;

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        "_blank"
    );

}


function absenceMessage(id, absenceDate = null) {

    const student =
        db.students.find(
            item => +item.id === +id
        );

    if (!student) return;

    if (!student.phone) {
        Swal.fire(
            "تنبيه",
            "رقم ولي الأمر غير مسجل",
            "warning"
        );
        return;
    }

    const date =
        absenceDate ||
        uiState.attendance.date ||
        getToday();

    const dateText =
        new Date(`${date}T00:00:00`).toLocaleDateString("ar-EG");

    const message =
`السيد/ة ولي أمر الطالب ${student.name}،

نحيطكم علمًا أن ابنكم ${student.name} غاب في يوم ${dateText}.

مع خالص التحية،
سنتر فور يو`;

    const phone =
        normalizeEgyptPhone(
            student.phone
        );

    if (!phone) {
        Swal.fire(
            "تنبيه",
            "رقم ولي الأمر غير صالح",
            "warning"
        );
        return;
    }

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        "_blank"
    );

}

function renderPayments() {

    const summary =
        document.getElementById(
            "paymentSummary"
        );

    const listContainer =
        document.getElementById(
            "paymentList"
        );


    if (!summary || !listContainer) {
        return;
    }


    const month =
        uiState.payments.month ||
        getCurrentMonth();


    const teacherId =
        uiState.payments.teacher;


    const grade =
        uiState.payments.grade;


    const baseList =
        db.students.filter(
            student =>

                (!teacherId ||
                    +student.teacherId ===
                    +teacherId)

                &&

                (!grade ||
                    student.grade === grade)
        );

    const search =
        uiState.payments.search
            .trim()
            .toLowerCase();

    const list =
        baseList.filter(student => {

            if (!search) {
                return true;
            }

            const teacherName =
                teacher(student.teacherId)?.name || "";

            const text =
                `${student.name || ""} ${
                    student.parentName || ""
                } ${student.phone || ""} ${
                    student.grade || ""
                } ${teacherName} ${getStudentGroupLabel(student)}`.toLowerCase();

            return text.includes(search);

        });


    const paid =
        list.filter(
            student =>
                db.payments?.[month]?.[
                    student.id
                ] === true
        ).length;


    const unpaid =
        list.length - paid;


    summary.innerHTML = `

        <div class="card p-5">

            <div class="text-sm text-slate-400">

            </div>

        </div>


        <div class="card p-5">

            <div class="text-sm text-red-500">
                غير المدفوع
            </div>

            <div class="text-3xl font-black text-red-500 mt-1">
                ${unpaid}
            </div>

        </div>

    `;


    listContainer.innerHTML =
        list.map(
            student => {

                const isPaid =
                    db.payments?.[month]?.[

                    ] === true;


                return `

                    <div class="card p-4 flex flex-wrap gap-3 items-center">

                        <div class="flex-1 min-w-[220px]">

                                    ? "تم الدفع"

                                ? `

                                        <i class="fa-solid fa-xmark ml-1"></i>

function collectTeacherGroupDraft() {
    return [...document.querySelectorAll(".teacher-group-row")].map(row => ({
        id: row.querySelector(".teacher-group-id")?.value || "",
        grade: row.querySelector(".teacher-group-grade")?.value || "",
        name: row.querySelector(".teacher-group-name")?.value.trim() || "",
        schedule: row.querySelector(".teacher-group-schedule")?.value || "",
        time: row.querySelector(".teacher-group-time")?.value || ""
    }));
}

function renderTeacherGroupRows() {
    const box = document.getElementById("teacherGroupsBox");
    if (!box) return;
    box.innerHTML = teacherGroupDraft.map((g,index) => teacherGroupRowHTML(g,index)).join("");
}

function addTeacherGroupRow() {
    teacherGroupDraft = collectTeacherGroupDraft();
    teacherGroupDraft.push({ id: "", name: `مجموعة ${teacherGroupDraft.length + 1}`, grade: "", schedule: "", time: "" });
    renderTeacherGroupRows();
}

function removeTeacherGroupRow(button) {
    teacherGroupDraft = collectTeacherGroupDraft();
    const index = [...document.querySelectorAll(".teacher-group-row")].indexOf(button.closest(".teacher-group-row"));
    if (index >= 0) teacherGroupDraft.splice(index, 1);
    renderTeacherGroupRows();
}

function teacherGroupEditor(selected = []) {
    teacherGroupDraft = Array.isArray(selected) && selected.length
        ? selected.map(g => ({...g}))
        : [{ id: "", name: "مجموعة 1", grade: "", schedule: "", time: "" }];

    return `
        <div style="text-align:right;margin-top:12px">
            <div style="font-weight:900;margin-bottom:8px">مجموعات المدرس</div>
            <div style="font-size:11px;color:#64748b;margin-bottom:10px">كل مجموعة لها سنة مستقلة وطلابها وأيامها ووقت الحصة.</div>
            <div id="teacherGroupsBox" style="max-height:380px;overflow:auto;padding:4px">
                ${teacherGroupDraft.map((g,index) => teacherGroupRowHTML(g,index)).join("")}
            </div>
            <button type="button" onclick="addTeacherGroupRow()" class="swal2-styled" style="background:#2563eb;margin:8px 0 0">+ إضافة مجموعة</button>
        </div>
    `;
}

function readTeacherGroups() {
    const rows = collectTeacherGroupDraft();
    const groups = [];

    rows.forEach((g,index) => {
        if (!g.grade) return;
        groups.push({
            id: g.id || uid(),
            name: g.name || `مجموعة ${index + 1}`,
            grade: g.grade,
            schedule: g.schedule,
            time: g.time
        });
    });

    return groups;
}

async function editTeacher(id) {

    const t = teacher(id);
    if (!t) return;

    const result =
        await Swal.fire({

            title: "تعديل المدرس",

            html: `
                <input id="teacherName" class="swal2-input" value="${esc(t.name)}">
                <input id="teacherSubject" class="swal2-input" value="${esc(t.subject || "")}">
                ${teacherGroupEditor(t.groups || [])}
            `,

            width: 650,
            showCancelButton: true,
            confirmButtonText: "حفظ",
            cancelButtonText: "إلغاء",

            preConfirm: () => ({
                name: document.getElementById("teacherName").value.trim(),
                subject: document.getElementById("teacherSubject").value.trim(),
                groups: readTeacherGroups()
            })

        });

    if (!result.isConfirmed) return;

    const oldGroupIds = new Set((t.groups || []).map(g => String(g.id)));

    Object.assign(t, result.value);

    // Keep students attached to a valid group after groups are edited.
    const validGroups = t.groups || [];
    db.students
        .filter(student => +student.teacherId === +t.id)
        .forEach(student => {
            let group = validGroups.find(g => String(g.id) === String(student.groupId));

            if (!group) {
                group = validGroups.find(g => g.grade === student.grade);
            }

            if (group) {
                student.groupId = group.id;
                student.grade = group.grade;
            } else {
                student.groupId = "";
            }
        });

    await saveDatabase();
    render();

}


async function deleteTeacher(id) {

    const result =
        await Swal.fire({

            title: "حذف المدرس؟",

            text:
                "سيتم إزالة المدرس من الطلاب المرتبطين به.",

            icon: "warning",

            showCancelButton: true,

            confirmButtonText: "حذف",

            cancelButtonText: "إلغاء"

        });


    if (!result.isConfirmed) {
        return;
    }


    db.teachers =
        db.teachers.filter(
            t => +t.id !== +id
        );


    db.students.forEach(
        student => {

            if (+student.teacherId === +id) {
                student.teacherId = "";
                student.groupId = "";
            }

        }
    );


    await saveDatabase();

    render();

}

        result.value
    );


    await saveDatabase();

    render();

}


async function deleteStudent(id) {

    const result =
        await Swal.fire({

            title: "حذف الطالب؟",

            text:
                "سيتم حذف بيانات الطالب وسجل غيابه والمدفوعات الخاصة به.",

            icon: "warning",

            showCancelButton: true,

            confirmButtonText: "حذف",

            cancelButtonText: "إلغاء"

        });


    if (!result.isConfirmed) {
        return;
    }


    db.students =
        db.students.filter(
            student =>
                +student.id !== +id
        );


    Object.values(
        db.attendance || {}
    ).forEach(
        day => {

            if (day) {
                delete day[id];
            }

        }
    );


    Object.values(
        db.payments || {}
    ).forEach(
        month => {

            if (month) {
                delete month[id];
            }

        }
    );


    await saveDatabase();

    render();

}
