<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4U | نظام إدارة السنتر</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Cairo", sans-serif;
            background: #f5f7fb;
            color: #0f172a;
        }

        body.dark {
            background: #080d18;
            color: #e5e7eb;
        }

        .sidebar {
            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, .25),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #07101f,
                    #0f172a
                );
        }

        .surface {
            background: #ffffff;
        }

        body.dark .surface {
            background: #111827 !important;
            color: #e5e7eb;
        }

        body.dark input,
        body.dark select,
        body.dark textarea {
            background: #1f2937 !important;
            color: #fff !important;
            border-color: #374151 !important;
        }

        body.dark .soft-bg {
            background: #1f2937 !important;
        }

        body.dark .table-head {
            background: #111827 !important;
        }

        body.dark .border-soft {
            border-color: #273449 !important;
        }

        body.dark .text-muted {
            color: #94a3b8 !important;
        }

        .card {
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, .06);
        }

        .nav-btn {
            transition: .2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, .08);
        }

        .nav-btn.active {
            color: #fff;
            background: #2563eb;
            box-shadow:
                0 12px 30px rgba(37, 99, 235, .28);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: grid;
            place-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 999px;
            padding: 6px 11px;
            font-size: 10px;
            font-weight: 800;
        }

        .btn {
            transition: .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .modal-bg {
            background: rgba(2, 6, 23, .70);
            backdrop-filter: blur(7px);
        }

        .att-btn {
            width: 31px;
            height: 31px;
            border-radius: 9px;
            font-size: 10px;
            border: 1px solid #e2e8f0;
            transition: .15s;
        }

        .att-btn:hover {
            transform: scale(1.05);
        }

        .att-present.active {
            color: #fff;
            background: #22c55e;
            border-color: #22c55e;
        }

        .att-absent.active {
            color: #fff;
            background: #ef4444;
            border-color: #ef4444;
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 900px) {
            .mobile-only {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                right: -290px;
                bottom: 0;
                width: 280px;
                z-index: 100;
                transition: .25s ease;
            }

            .sidebar.open {
                right: 0;
            }

            .content-grid {
                grid-template-columns: 1fr !important;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr !important;
            }

            .hide-mobile {
                display: none !important;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        body.dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>

<body>

<div id="app" class="min-h-screen flex">

    <!-- ================= SIDEBAR ================= -->

    <aside
        id="sidebar"
        class="sidebar w-72 shrink-0 text-slate-300 p-5 flex flex-col"
    >

        <div class="flex items-center justify-between mb-8">

            <div>
                <div class="text-white text-3xl font-black italic">
                    4U
                </div>

                <div
                    class="text-[10px] text-blue-400 font-black tracking-[.3em]"
                >
                    CENTER MANAGEMENT
                </div>
            </div>

            <button
                onclick="toggleSidebar(false)"
                class="mobile-only text-xl"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <!-- User -->
        <div class="bg-white/5 rounded-2xl p-4 mb-5">

            <div class="text-[10px] text-slate-400">
                المستخدم الحالي
            </div>

            <div class="font-black text-white mt-1">
                مسؤول 4U
            </div>

            <div class="text-[10px] text-emerald-400 mt-1">
                <i class="fa-solid fa-circle text-[6px]"></i>
                مدير النظام
            </div>

        </div>

        <!-- Navigation -->

        <nav class="space-y-1">

            <button
                class="nav-btn active w-full p-3.5 rounded-xl text-right font-bold"
                data-view="dashboard"
                onclick="setView('dashboard')"
            >
                <i class="fa-solid fa-chart-pie ml-3"></i>
                لوحة التحكم
            </button>

            <button
                class="nav-btn w-full p-3.5 rounded-xl text-right font-bold"
                data-view="students"
                onclick="setView('students')"
            >
                <i class="fa-solid fa-user-graduate ml-3"></i>
                الطلاب
            </button>

            <button
                class="nav-btn w-full p-3.5 rounded-xl text-right font-bold"
                data-view="teachers"
                onclick="setView('teachers')"
            >
                <i class="fa-solid fa-chalkboard-user ml-3"></i>
                المدرسون
            </button>

            <button
                class="nav-btn w-full p-3.5 rounded-xl text-right font-bold"
                data-view="attendance"
                onclick="setView('attendance')"
            >
                <i class="fa-solid fa-calendar-check ml-3"></i>
                الحضور والغياب
            </button>

            <button
                class="nav-btn w-full p-3.5 rounded-xl text-right font-bold"
                data-view="finance"
                onclick="setView('finance')"
            >
                <i class="fa-solid fa-wallet ml-3"></i>
                فلوس الشهر
            </button>

            <button
                class="nav-btn w-full p-3.5 rounded-xl text-right font-bold"
                data-view="reports"
                onclick="setView('reports')"
            >
                <i class="fa-solid fa-file-lines ml-3"></i>
                التقارير
            </button>

        </nav>

        <!-- Bottom -->

        <div class="mt-auto space-y-2">

            <button
                onclick="toggleDark()"
                class="w-full p-3 rounded-xl bg-white/5 hover:bg-white/10 text-right font-bold"
            >
                <i id="themeIcon" class="fa-solid fa-moon ml-3"></i>
                الوضع الليلي
            </button>

            <button
                onclick="backupData()"
                class="w-full p-3 rounded-xl bg-blue-500/10 text-blue-300 text-right font-bold"
            >
                <i class="fa-solid fa-download ml-3"></i>
                نسخة احتياطية
            </button>

            <button
                onclick="document.getElementById('restoreFile').click()"
                class="w-full p-3 rounded-xl bg-emerald-500/10 text-emerald-300 text-right font-bold"
            >
                <i class="fa-solid fa-upload ml-3"></i>
                استرجاع نسخة
            </button>

            <input
                id="restoreFile"
                type="file"
                accept=".json"
                class="hidden"
                onchange="restoreData(event)"
            >

            <button
                onclick="newMonth()"
                class="w-full p-3 rounded-xl bg-rose-500/10 text-rose-300 text-right font-bold"
            >
                <i class="fa-solid fa-rotate ml-3"></i>
                شهر جديد
            </button>

        </div>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="flex-1 min-w-0">

        <header
            class="surface sticky top-0 z-30 border-b border-soft px-5 md:px-7 py-4 flex items-center gap-4"
        >

            <button
                class="mobile-only text-xl"
                onclick="toggleSidebar()"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="flex-1">

                <div
                    id="pageTitle"
                    class="font-black text-xl"
                >
                    لوحة التحكم
                </div>

                <div
                    id="monthLabel"
                    class="text-[11px] text-slate-400 font-bold"
                ></div>

            </div>

            <div class="hidden md:block relative">

                <i
                    class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"
                ></i>

                <input
                    id="globalSearch"
                    oninput="globalSearch()"
                    class="w-64 pr-10 pl-3 py-2.5 rounded-xl bg-slate-100 border-none outline-none"
                    placeholder="بحث عن طالب..."
                >

            </div>

            <button
                onclick="addStudent()"
                class="btn px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-sm"
            >
                <i class="fa-solid fa-plus ml-2"></i>
                طالب
            </button>

        </header>

        <div
            id="content"
            class="p-5 md:p-7"
        ></div>

    </main>

</div>


<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="hidden fixed inset-0 z-[200] modal-bg items-center justify-center p-4"
>
    <div
        id="modalBox"
        class="surface w-full max-w-3xl max-h-[92vh] overflow-y-auto rounded-3xl p-6"
    ></div>
</div>


<script>

/* =========================================================
   4U CENTER
   DATABASE
========================================================= */

const STORAGE_KEY = "4U_CENTER_DATABASE_V5";

const GRADES = [
    "الأول الإعدادي",
    "الثاني الإعدادي",
    "الثالث الإعدادي",
    "الأول الثانوي",
    "الثاني الثانوي",
    "الثالث الثانوي",
    "الأول باكالوريا",
    "الثاني باكالوريا"
];

let db = loadDatabase();

let view = "dashboard";


/* =========================================================
   DATABASE DEFAULT
========================================================= */

function defaultDatabase() {

    return {
        settings: {
            month: new Date().toISOString().slice(0, 7),
            dark: false
        },

        teachers: [],

        students: [],

        payments: [],

        attendance: {}
    };
}


/* =========================================================
   LOAD DATABASE
========================================================= */

function loadDatabase() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return defaultDatabase();
        }

        const data = JSON.parse(saved);

        return {
            ...defaultDatabase(),
            ...data,
            settings: {
                ...defaultDatabase().settings,
                ...(data.settings || {})
            }
        };

    } catch (error) {

        console.error(error);

        return defaultDatabase();
    }
}


/* =========================================================
   SAVE
========================================================= */

function saveDatabase() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

    render();
}


/* =========================================================
   HELPERS
========================================================= */

function uid() {

    return Date.now() +
        Math.floor(Math.random() * 100000);
}


function esc(value = "") {

    return String(value)
        .replace(/[&<>"']/g, char => {

            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return map[char];
        });
}


function money(value) {

    return Number(value || 0)
        .toLocaleString("ar-EG") + " ج.م";
}


function month() {

    return db.settings.month;
}


function monthName(value) {

    const [year, m] = value.split("-");

    return new Date(
        Number(year),
        Number(m) - 1,
        1
    ).toLocaleDateString(
        "ar-EG",
        {
            month: "long",
            year: "numeric"
        }
    );
}


function teacher(id) {

    return db.teachers.find(
        t => Number(t.id) === Number(id)
    );
}


function student(id) {

    return db.students.find(
        s => Number(s.id) === Number(id)
    );
}


/* =========================================================
   PAYMENT
========================================================= */

function hasPaid(studentId) {

    return db.payments.some(
        p =>
            Number(p.studentId) === Number(studentId) &&
            p.month === month()
    );
}


/* =========================================================
   ATTENDANCE
========================================================= */

function attendance(studentId) {

    if (!db.attendance[month()]) {
        db.attendance[month()] = {};
    }

    return db.attendance[month()][studentId] || {};
}


function attendanceStats(studentId) {

    const values =
        Object.values(attendance(studentId));

    return {

        present:
            values.filter(
                x => x === true
            ).length,

        absent:
            values.filter(
                x => x === false
            ).length,

        total:
            values.filter(
                x => x !== null &&
                     x !== undefined
            ).length
    };
}


/* =========================================================
   UI
========================================================= */

function toggleSidebar(force) {

    const sidebar =
        document.getElementById("sidebar");

    if (force === false) {
        sidebar.classList.remove("open");
        return;
    }

    sidebar.classList.toggle("open");
}


function setView(newView) {

    view = newView;

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.view === view
            );
        });

    if (window.innerWidth < 901) {
        toggleSidebar(false);
    }

    render();
}


function toggleDark() {

    db.settings.dark =
        !db.settings.dark;

    applyTheme();

    saveDatabase();
}


function applyTheme() {

    document.body.classList.toggle(
        "dark",
        !!db.settings.dark
    );

    const icon =
        document.getElementById("themeIcon");

    if (icon) {

        icon.className =
            db.settings.dark
                ? "fa-solid fa-sun ml-3"
                : "fa-solid fa-moon ml-3";
    }
}


/* =========================================================
   MODALS
========================================================= */

function openModal(html) {

    document.getElementById(
        "modalBox"
    ).innerHTML = html;

    document
        .getElementById("modal")
        .classList.remove("hidden");

    document
        .getElementById("modal")
        .classList.add("flex");
}


function closeModal() {

    document
        .getElementById("modal")
        .classList.add("hidden");

    document
        .getElementById("modal")
        .classList.remove("flex");
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const titleMap = {

        dashboard: "لوحة التحكم",

        students: "إدارة الطلاب",

        teachers: "المدرسون",

        attendance: "الحضور والغياب",

        finance: "فلوس الشهر",

        reports: "التقارير"
    };


    const title =
        document.getElementById("pageTitle");

    const label =
        document.getElementById("monthLabel");

    const content =
        document.getElementById("content");


    if (title) {
        title.textContent =
            titleMap[view];
    }


    if (label) {

        label.textContent =
            "الشهر الحالي: " +
            monthName(month());
    }


    applyTheme();


    if (view === "dashboard") {
        content.innerHTML =
            dashboardHTML();

        setTimeout(
            drawCharts,
            50
        );
    }

    if (view === "students") {
        content.innerHTML =
            studentsHTML();
    }

    if (view === "teachers") {
        content.innerHTML =
            teachersHTML();
    }

    if (view === "attendance") {
        content.innerHTML =
            attendanceHTML();
    }

    if (view === "finance") {
        content.innerHTML =
            financeHTML();
    }

    if (view === "reports") {
        content.innerHTML =
            reportsHTML();
    }
}


/* =========================================================
   STATISTICS
========================================================= */

function statistics() {

    const total =
        db.students.length;

    const paid =
        db.students.filter(
            s => hasPaid(s.id)
        ).length;

    let present = 0;
    let absent = 0;

    db.students.forEach(s => {

        const stats =
            attendanceStats(s.id);

        present += stats.present;
        absent += stats.absent;
    });


    return {
        total,
        paid,
        unpaid: total - paid,
        present,
        absent,
        teachers: db.teachers.length
    };
}


/* =========================================================
   STAT CARD
========================================================= */

function statCard(
    title,
    value,
    icon,
    color
) {

    return `
        <div class="surface card p-5 border border-soft">

            <div class="flex justify-between items-start">

                <div>

                    <div class="text-xs text-slate-400 font-bold">
                        ${title}
                    </div>

                    <div class="text-2xl font-black mt-2">
                        ${value}
                    </div>

                </div>

                <div class="stat-icon ${color}">
                    <i class="fa-solid ${icon}"></i>
                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   DASHBOARD
========================================================= */

function dashboardHTML() {

    const s =
        statistics();

    return `

        <div class="space-y-6">

            <div class="grid stats-grid grid-cols-2 lg:grid-cols-4 gap-4">

                ${statCard(
                    "إجمالي الطلاب",
                    s.total,
                    "fa-user-graduate",
                    "bg-blue-50 text-blue-600"
                )}

                ${statCard(
                    "تم دفع الشهر",
                    s.paid,
                    "fa-circle-check",
                    "bg-emerald-50 text-emerald-600"
                )}

                ${statCard(
                    "لم يتم الدفع",
                    s.unpaid,
                    "fa-circle-xmark",
                    "bg-rose-50 text-rose-600"
                )}

                ${statCard(
                    "الغياب المسجل",
                    s.absent,
                    "fa-user-xmark",
                    "bg-amber-50 text-amber-600"
                )}

            </div>


            <div class="grid lg:grid-cols-2 gap-5">

                <div class="surface card p-5">

                    <div class="font-black mb-4">
                        الطلاب حسب الصف
                    </div>

                    <canvas
                        id="gradeChart"
                        height="150"
                    ></canvas>

                </div>


                <div class="surface card p-5">

                    <div class="font-black mb-4">
                        حالة دفع الشهر
                    </div>

                    <canvas
                        id="paymentChart"
                        height="150"
                    ></canvas>

                </div>

            </div>


            <div class="grid lg:grid-cols-2 gap-5">

                <div class="surface card overflow-hidden">

                    <div class="p-5 flex justify-between">

                        <span class="font-black">
                            آخر الطلاب المضافين
                        </span>

                        <button
                            onclick="setView('students')"
                            class="text-blue-600 text-xs font-bold"
                        >
                            عرض الكل
                        </button>

                    </div>

                    ${recentStudents()}

                </div>


                <div class="surface card overflow-hidden">

                    <div class="p-5 flex justify-between">

                        <span class="font-black">
                            الطلاب الغائبون
                        </span>

                        <button
                            onclick="setView('attendance')"
                            class="text-blue-600 text-xs font-bold"
                        >
                            الحضور
                        </button>

                    </div>

                    ${recentAbsences()}

                </div>

            </div>

        </div>
    `;
}


function recentStudents() {

    const list =
        db.students
            .slice()
            .reverse()
            .slice(0, 5);

    if (!list.length) {
        return empty(
            "لم تتم إضافة طلاب بعد"
        );
    }


    return `
        <div class="divide-y divide-slate-100 dark:divide-slate-800">

            ${list.map(s => `

                <div
                    class="p-4 flex justify-between items-center"
                >

                    <div>

                        <b>
                            ${esc(s.name)}
                        </b>

                        <div class="text-[10px] text-slate-400">
                            ${esc(s.grade)}
                        </div>

                    </div>

                    <span class="badge bg-blue-100 text-blue-600">
                        ${esc(
                            teacher(s.teacherId)?.name ||
                            "بدون مدرس"
                        )}
                    </span>

                </div>

            `).join("")}

        </div>
    `;
}


function recentAbsences() {

    const list = [];

    db.students.forEach(s => {

        const stats =
            attendanceStats(s.id);

        if (stats.absent > 0) {

            list.push({
                student: s,
                absent: stats.absent
            });
        }
    });


    if (!list.length) {

        return empty(
            "لا توجد حالات غياب مسجلة"
        );
    }


    return `
        <div class="divide-y divide-slate-100 dark:divide-slate-800">

            ${list.slice(0, 5).map(x => `

                <div
                    class="p-4 flex justify-between items-center"
                >

                    <div>

                        <b>
                            ${esc(x.student.name)}
                        </b>

                        <div class="text-[10px] text-slate-400">
                            ${esc(x.student.grade)}
                        </div>

                    </div>

                    <span class="badge bg-rose-100 text-rose-600">
                        غياب ${x.absent}
                    </span>

                </div>

            `).join("")}

        </div>
    `;
}


/* =========================================================
   STUDENTS
========================================================= */

function studentsHTML() {

    return `

        <div class="space-y-5">

            <div class="surface card p-5">

                <div
                    class="flex flex-col lg:flex-row gap-3"
                >

                    <div class="relative flex-1">

                        <i
                            class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"
                        ></i>

                        <input
                            id="studentSearch"
                            oninput="filterStudents()"
                            class="w-full pr-10 p-3 rounded-xl bg-slate-100 border-none outline-none"
                            placeholder="ابحث بالاسم أو رقم ولي الأمر..."
                        >

                    </div>


                    <select
                        id="gradeFilter"
                        onchange="filterStudents()"
                        class="p-3 rounded-xl bg-slate-100 border-none outline-none"

function filterStudents() {

    const search =
        (
            document.getElementById(
                "studentSearch"
            )?.value || ""
        ).toLowerCase();


    const grade =
        document.getElementById(
            "gradeFilter"
        )?.value || "";


    const teacherId =
        document.getElementById(
            "teacherFilter"
        )?.value || "";


    const filtered =
        db.students.filter(s => {

            const text =
                `${s.name} ${s.phone || ""}`
                    .toLowerCase();

            return (
                text.includes(search) &&
                (!grade || s.grade === grade) &&
                (
                    !teacherId ||
                    Number(s.teacherId) ===
                    Number(teacherId)
                )
            );
        });


    document.getElementById(
        "studentsBody"
    ).innerHTML =

        filtered.length
            ? filtered.map(studentRow).join("")
            : `
                <tr>
                    <td colspan="7">
                        ${empty("لا توجد نتائج")}
                    </td>
                </tr>
              `;
}

async function addTeacher() {

            confirmButtonText: "إضافة",

            cancelButtonText: "إلغاء",

            showCancelButton: true,

            preConfirm: () => {

                const name =
                    document.getElementById(
                        "teacherName"
                    ).value.trim();

                const subject =
                    document.getElementById(
                        "teacherSubject"
                    ).value.trim();

                const sessions =
                    Number(

function setAttendance(
    studentId,
    day,
    value
) {

    db.attendance[month()] ??= {};

    db.attendance[month()][studentId] ??= {};


    const old =
        db.attendance[month()][studentId][day];


    db.attendance[month()][studentId][day] =
        old === value
            ? null
            : value;


    saveDatabase();


    /*
        لو تم تسجيل غياب لأول مرة
        يظهر للمسؤول خيار إرسال رسالة.
    */

    if (
        value === false &&
        old !== false
    ) {

        setTimeout(
            () => offerAbsenceMessage(studentId),
            100
        );
    }
}


function markToday(value) {

    const day =
        new Date().getDate();


    db.attendance[month()] ??= {};


    db.students.forEach(s => {

        db.attendance[month()][s.id] ??= {};

        db.attendance[month()][s.id][day] =
            value;
    });


    saveDatabase();


    if (value === false) {

        Swal.fire({
            title: "تم تسجيل الغياب",
            text: "يمكنك إرسال رسائل لأولياء الأمور من تفاصيل كل طالب.",
            icon: "info"
        });
    }
}


async function offerAbsenceMessage(id) {

        student(id);

            icon: "warning",

            confirmButtonText: "فتح WhatsApp",

        });

        sendAbsenceMessage(id);
    }
}


/* =========================================================
   WHATSAPP
========================================================= */

function normalizeEgyptPhone(phone) {

    let number =
        String(phone || "")
            .replace(/\D/g, "");


    if (number.startsWith("01")) {
        number =
            "2" + number;
    }


    if (
        number.startsWith("20")
    ) {
        return number;
    }


    return number;
}


function openWhatsApp(
    phone,
    message
) {

    const number =
        normalizeEgyptPhone(phone);


    if (!number) {

        Swal.fire(
            "لا يوجد رقم",
            "أضف رقم ولي الأمر أولًا.",
            "warning"
        );

        return;
    }


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );
}

async function sendAllMonthlyReports() {

        db.students.filter(
            s => s.phone
        );


    if (!withPhones.length) {

        return Swal.fire(
            "لا توجد أرقام",
            "لا يوجد طلاب لديهم أرقام لأولياء الأمور.",
            "warning"
        );
    }


    const result =
        await Swal.fire({

            title: "التقارير الشهرية",

            text:
                "سيتم فتح WhatsApp لكل طالب على حدة. يجب الضغط على إرسال في WhatsApp لكل رسالة.",

            icon: "info",

            showCancelButton: true,

            confirmButtonText: "ابدأ",

            cancelButtonText: "إلغاء"
        });


    if (!result.isConfirmed) {
        return;
    }


    let index = 0;


    function next() {

        if (
            index >=
            withPhones.length
        ) {

            Swal.fire(
                "تم",
                "تم الانتهاء من تجهيز التقارير.",
                "success"
            );

            return;
        }


        const s =
            withPhones[index];


        index++;


        sendMonthlyReport(s.id);


        setTimeout(
            next,
            1500
        );
    }


    next();
}

function backupData() {

    const blob =
        new Blob(
            [
                JSON.stringify(
                    db,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        `4U-Backup-${month()}.json`;


    link.click();


    URL.revokeObjectURL(url);
}


/* =========================================================
   RESTORE
========================================================= */

function restoreData(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        async () => {

            try {

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if (
                    !imported.students ||
                    !imported.teachers
                ) {
                    throw new Error(
                        "Invalid"
                    );
                }


                const result =
                    await Swal.fire({

                        title:
                            "استرجاع النسخة؟",

                        text:
                            "سيتم استبدال البيانات الحالية.",

                        icon:
                            "warning",

                        showCancelButton:
                            true,

                        confirmButtonText:
                            "استرجاع",

                        cancelButtonText:
                            "إلغاء"
                    });


                if (
                    !result.isConfirmed
                ) {
                    return;
                }


                db = imported;

                saveDatabase();


                Swal.fire(
                    "تم",
                    "تم استرجاع البيانات بنجاح.",
                    "success"
                );

            } catch {

                Swal.fire(
                    "خطأ",
                    "ملف النسخة الاحتياطية غير صالح.",
                    "error"
                );
            }
        };


    reader.readAsText(file);
}

        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "طلاب 4U"
    );


    XLSX.writeFile(
        workbook,
        `4U-Report-${month()}.xlsx`
    );
}

/* =========================================================
   NEW MONTH
========================================================= */

async function newMonth() {

    const result =
        await Swal.fire({

            title:
                "بدء شهر جديد",

            html: `

                <input
                    id="newMonthValue"
                    type="month"
                    class="swal2-input"
                    value="${month()}"
                >

            `,

            showCancelButton:
                true,

            confirmButtonText:
                "بدء الشهر",

            cancelButtonText:
                "إلغاء",

            preConfirm: () => {

                return document
                    .getElementById(
                        "newMonthValue"
                    )
                    .value;
            }
        });


    if (!result.isConfirmed) {
        return;
    }


    if (!result.value) {
        return;
    }


    db.settings.month =
        result.value;


    db.attendance[
        result.value
    ] ??= {};


    saveDatabase();
}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function globalSearch() {

    const input =
        document.getElementById(
            "globalSearch"
        );


    const q =
        input?.value.trim();


    if (!q) {
        return;
    }


    setView(
        "students"
    );


    setTimeout(
        () => {

            const search =
                document.getElementById(
                    "studentSearch"
                );


            if (search) {

                search.value =
                    q;

                filterStudents();
            }

        },
        50
    );
}
